name: Daily Stock Sync

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas finance-datareader lxml beautifulsoup4 requests html5lib

      - name: Run Collector
        run: python collector.py

      - name: Commit and Push
        run: |
          git config --global user.name "StockBot"
          git config --global user.email "bot@example.com"
          git add stocks.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update stock data"
          git push
